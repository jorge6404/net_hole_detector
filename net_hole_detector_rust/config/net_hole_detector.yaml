/**:
  ros__parameters:
    # Entradas
    image_transport: compressed        # raw | compressed
    is_rectified: false                # true → P, false → K
    calibration_file: ""               # vacío → config/right_laser.yaml del paquete
    camera_frame: ""                   # vacío → frame_id de la imagen

    # Modelo e inferencia
    model:
      path: ""                         # vacío → models/yolov8_hole_detector_5_best.onnx del paquete; relativo → respecto al share del paquete
      input_size: 640                  # se valida contra la metadata del ONNX
    inference:
      engine: tensorrt                 # tensorrt | cuda | cpu   (baja por la cadena si no está disponible)
      trt_fp16: true
      trt_cache_dir: "~/.ros/net_hole_detector/trt_cache"
      device_id: 0
      cpu_threads: 0
    yolo:
      confidence_threshold: 0.4
      iou_threshold: 0.45
      max_detections: 5
      period_s: 0.5
    max_z_age_s: 0.5

    # Red
    net:
      mesh_cell_size_m: 0.07          # lado de la celda (área real = lado²)

    # CLAHE (antes del detector y de los blobs)
    clahe:
      enabled: true
      clip_limit: 2.5
      grid_size: 8

    # Visión clásica (blobs)
    blobs:
      blur_kernel: 7
      morph_kernel: 5
      thresh_block_size: 41
      thresh_c: 5.0
      min_area_px: 25.0
      max_percent_area: 0.1
      min_aspect: 0.5
      max_aspect: 2.0
